url: https://caravagnalab.github.io/PEPI/

template:
  bootstrap: 5
  bootswatch: simplex

authors:
  Giulio Caravagna:
    href: https://www.caravagnalab.org/

articles:
- title: Articles
  navbar: ~
  contents:
  - articles/Model_notation
  - articles/Data_generation
  - articles/Multirates_inference
  - articles/Convergence_diagnostics

reference:
- title: Input & data construction
  desc: Functions to validate a multirates input and build the corresponding Stan data list.
  contents:
  - init_multirates
  - check_input_multirates
  - build_stan_data_multirates

- title: Fitting
  desc: Fit the unified multirates model with Hamiltonian Monte Carlo.
  contents:
  - fit_multirates

- title: Getters
  desc: Functions to extract posterior draws and posterior predictive trajectories from a fit.
  contents:
  - get_posterior_multirates
  - get_predicted_trajectories
  - get_init_values

- title: Inference plots
  desc: Prior vs posterior distributions and posterior predictive checks.
  contents:
  - plot_prior_posterior
  - plot_posterior_predictive
  - plot_fractions
  - plot_counts
  - plot_split
  - plot_ccf

- title: Convergence diagnostics
  desc: Thin bayesplot wrappers for the MCMC fit returned by `fit_multirates()`.
  contents:
  - plot_diagnostics
  - plot_trace
  - plot_rhat
  - plot_ess
  - plot_acf
  - plot_divergences
  - plot_energy
  - plot_treedepth
  - plot_pairs
